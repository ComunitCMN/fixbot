[pytest]
asyncio_mode = auto

# Каждый асинхронный тест получает свой цикл событий и не тащит состояние
# в соседний. Раньше это подразумевалось, но pytest-asyncio предупреждал,
# что умолчание изменится, — задаём явно, чтобы обновление библиотеки
# ничего не переставило молча.
asyncio_default_fixture_loop_scope = function
